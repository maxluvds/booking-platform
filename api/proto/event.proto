syntax = "proto3";

package event;

option go_package = "github.com/maxluvds/booking-platform/api/proto;proto";

service EventService {
    rpc CreateEvent(CreateEventRequest) returns (EventResponse);
    rpc GetEvent(GetEventRequest) returns (EventResponse);
    rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
    rpc UpdateEvent(UpdateEventRequest) returns (EventResponse);
    rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
    rpc GetAvailableSeats(GetAvailableSeatsRequest) returns (GetAvailableSeatsResponse);
}

message Event {
    int64 id = 1;
    string title = 2;
    string description = 3;
    string city = 4;
    string address = 5;
    string category = 6;
    string date = 7;
    int32 total_seats = 8;
    int32 available_seats = 9;
    double price = 10;
    string status = 11;
    string created_at = 12;
    string updated_at = 13;
}

message CreateEventRequest {
    string title = 1;
    string description = 2;
    string city = 3;
    string address = 4;
    string category = 5;
    string date = 6;
    int32 total_seats = 7;
    double price = 8;
}

message GetEventRequest {
    int64 id = 1;
}

message ListEventsRequest {
    string city = 1;
    string category = 2;
    string status = 3;
    int32 limit = 4;
    int32 offset = 5;
}

message ListEventsResponse {
    repeated Event events = 1;
    int32 total = 2;
}

message UpdateEventRequest {
    int64 id = 1;
    optional string title = 2;
    optional string description = 3;
    optional string city = 4;
    optional string address = 5;
    optional string category = 6;
    optional string date = 7;
    optional int32 total_seats = 8;
    optional double price = 9;
    optional string status = 10;
}

message DeleteEventRequest {
    int64 id = 1;
}

message DeleteEventResponse {
    bool success = 1;
}

message EventResponse {
    Event event = 1;
}

message GetAvailableSeatsRequest {
    int64 event_id = 1;
}

message GetAvailableSeatsResponse {
    int64 event_id = 1;
    int32 available_seats = 2;
}