version: '3.8'

services:
  postgres-event:
    image: postgres:15-alpine
    container_name: booking-postgres-event
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - "5433:5432"
    volumes:
      - postgres-event-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-event-data: